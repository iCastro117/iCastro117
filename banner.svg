<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isabella Castro Camacho — UX/UI Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b87cf"/>
      <stop offset="55%" stop-color="#3f6fb5"/>
      <stop offset="100%" stop-color="#32599a"/>
    </linearGradient>
    <radialGradient id="sheen1" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen2" cx="88%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="300" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#sheen1)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#sheen2)"/>

    <!-- soft drifting blobs, same idea as the site's hero-circle decorations -->
    <circle cx="1080" cy="55" r="95" fill="#ffffff" opacity=".10" filter="url(#blur1)"/>
    <circle cx="990" cy="230" r="60" fill="#ffffff" opacity=".13" filter="url(#blur1)"/>
    <circle cx="140" cy="245" r="70" fill="#ffffff" opacity=".09" filter="url(#blur1)"/>
    <circle cx="60" cy="40" r="34" fill="#ffffff" opacity=".14" filter="url(#blur1)"/>
    <circle cx="640" cy="30" r="20" fill="#ffffff" opacity=".16" filter="url(#blur1)"/>

    <!-- chip: "UX/UI DESIGNER" -->
    <g transform="translate(64,46)">
      <rect x="0" y="0" width="196" height="34" rx="17" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".55"/>
      <circle cx="20" cy="17" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="20" cy="17" r="2.6" fill="#ffffff"/>
      <text x="38" y="22" font-family="Verdana, Geneva, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#ffffff">UX/UI DESIGNER</text>
    </g>

    <!-- name -->
    <text x="62" y="150" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-.5">Isabella Castro Camacho</text>

    <!-- tagline, mirroring the site's two-tone "It's not how IT LOOKS / It's how IT WORKS" -->
    <text x="64" y="196" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#eaf0fc">
      <tspan font-style="italic" fill-opacity=".85">It's not how</tspan>
      <tspan font-weight="800" letter-spacing="1"> IT LOOKS</tspan>
      <tspan fill-opacity=".7">  ·  </tspan>
      <tspan font-style="italic" fill-opacity=".85">It's how</tspan>
      <tspan font-weight="800" letter-spacing="1"> IT WORKS</tspan>
    </text>

    <!-- subtitle -->
    <text x="64" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#dbe6fb" fill-opacity=".9">Systems Engineering Professional · Human-Centered Digital Experiences</text>
    <text x="64" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#c8d7f4" fill-opacity=".8">Fundación Universitaria Konrad Lorenz · Bogotá, Colombia</text>
  </g>
</svg>
